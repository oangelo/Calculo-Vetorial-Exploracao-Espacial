<!doctype html>
<html lang="pt-BR" data-faction="soviet">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funções Vetoriais - Cálculo Vetorial</title>
    <link rel="stylesheet" href="../reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="../space-theme.css" />
    <script src="../reveal.js/dist/reveal.js"></script>
    <script src="../reveal.js/plugin/math/math.js"></script>
  </head>
  <body>
    <div class="reveal">
      <div class="slides" id="slides-container"></div>
    </div>
    <script>
      async function loadSlides() {
        const sections = [
          '00-capa.html',
          '01-historia.html',
          '02-funcao-vetorial.html',
          '03-campo-vetorial.html',
          '04-limites.html',
          '05-derivadas-parciais.html',
          '06-rotacional.html',
          '07-divergente.html',
          '08-resumo.html',
          '09-reflexao.html',
        ];

        const container = document.getElementById('slides-container');

        for (const sectionFile of sections) {
          try {
            const response = await fetch(sectionFile);
            if (!response.ok) throw new Error('Failed to load ' + sectionFile);

            const html = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            const inlineScripts = doc.querySelectorAll('script:not([src])');
            const sections = doc.querySelectorAll('body > section');

            sections.forEach(function (section) {
              container.appendChild(section);
            });

            for (const script of inlineScripts) {
              const scriptContent = script.textContent;
              if (scriptContent.trim()) {
                const newScript = document.createElement('script');
                newScript.textContent = scriptContent;
                document.body.appendChild(newScript);
              }
            }
          } catch (error) {
            console.error('Error loading ' + sectionFile + ':', error);
          }
        }

        Reveal.initialize({
          controls: true,
          progress: true,
          center: true,
          hash: true,
          plugins: [RevealMath.MathJax3],
        });
      }

      window.addEventListener('load', loadSlides);
    </script>
  </body>
</html>
