<!-- V-VISUALIZACAO Variante A: Canvas Grande + Controles Abaixo -->
<!-- Uso: visualizacao e o foco principal, precisa de espaco -->

<section>
  <div class="slide-header">SEÇÃO [NN] · [TÍTULO]</div>
  <div class="slide-body">
  <h3>Visualizacao: [Titulo]</h3>
  <canvas id="[id-unico]" class="visualization-canvas" width="700" height="400"></canvas>
  <div class="controls-container">
    <div class="control-slider">
      <label>[Label]:</label>
      <input type="range" id="[id]" min="0" max="100" value="50" />
    </div>
    <button class="control-button">Reiniciar</button>
  </div>
  </div>
  <div class="slide-footer">CV-CH[N]-[ANO] · CAPÍTULO [N]</div>
</section>
