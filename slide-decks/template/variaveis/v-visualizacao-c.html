<!-- V-VISUALIZACAO Variante C: Canvas com Overlay de Formulas -->
<!-- Uso: formula e visual devem ser vistas simultaneamente -->

<section>
  <div class="slide-header">SEÇÃO [NN] · [TÍTULO]</div>
  <div class="slide-body">
    <h3>Visualizacao: [Titulo]</h3>
    <div class="canvas-overlay">
      <canvas
        id="[id-unico]"
        class="visualization-canvas"
        width="700"
        height="400"
      ></canvas>
      <div class="math-section">
        <p>\[ [Formula relacionada] \]</p>
      </div>
    </div>
  </div>
  <div class="slide-footer">CV-CH[N]-[ANO] · CAPÍTULO [N]</div>
</section>
